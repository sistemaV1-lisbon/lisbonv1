<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LISBON — MOVIMENTO REAL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: white; }
        
        .camera-container { position: fixed; inset: 0; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(1); }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        
        /* 🟦 CAIXA QUE ANDA JUNTO */
        .marcador-container {
            position: fixed;
            z-index: 15;
            pointer-events: none;
            transition: left 0.05s linear, right 0.05s linear;
        }
        
        .caixa-hack {
            position: absolute;
            top: 12%;
            bottom: 12%;
            left: 8%;
            right: 8%;
            background: rgba(59, 130, 246, 0.22);
            border: 3px solid #3b82f6;
            border-radius: 12px;
            box-shadow: 
                0 0 20px rgba(59, 130, 246, 0.5),
                inset 0 0 12px rgba(59, 130, 246, 0.2);
            animation: brilho 1s ease-in-out infinite alternate;
        }
        
        /* 🔤 TEXTO EM CIMA DA CAIXA — SEMPRE JUNTO */
        .texto-hack {
            position: absolute;
            top: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid #4ade80;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
        }
        
        @keyframes brilho {
            from { box-shadow: 0 0 20px rgba(59,130,246,0.5), inset 0 0 12px rgba(59,130,246,0.2); }
            to { box-shadow: 0 0 32px rgba(59,130,246,0.7), inset 0 0 18px rgba(59,130,246,0.3); }
        }
        
        .info {
            position: fixed;
            bottom: 90px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 30;
            padding: 10px;
            font-size: 1rem;
            background: rgba(0,0,0,0.6);
        }
        .ativo { color: #4ade80; text-shadow: 0 0 8px rgba(74,222,128,0.5); }
        .esperando { color: #fbbf24; }
        
        .botoes {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            padding: 15px;
            background: linear-gradient(to top, #000 70%, transparent);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        button {
            padding: 14px 8px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .ligar { background: #16a34a; color: #000; }
        .fixar { background: #3b82f6; color: #fff; }
        .desligar { background: #1f2937; border: 2px solid #ef4444; color: #fff; }
    </style>
</head>
<body>

<!-- 🟦 MARCADOR COMPLETO — ANDA + TEXTO JUNTO -->
<div class="marcador-container" id="marcador" style="display:none;">
    <div class="texto-hack">button.thimbles-game__thimble 99 = 333 69</div>
    <div class="caixa-hack"></div>
</div>

<div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<div id="info" class="info">
    <div class="esperando">Ligue → mostre a pedrinha vermelha</div>
</div>

<div class="botoes">
    <button id="btnLigar" class="ligar">🔘 LIGAR</button>
    <button id="btnFixar" class="fixar" disabled>🎯 SEGUIR</button>
    <button id="btnDesligar" class="desligar" disabled>⭕ DESLIGAR</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: false });
const marcadorEl = document.getElementById('marcador');
const infoEl = document.getElementById('info');

const btn = {
    ligar: document.getElementById('btnLigar'),
    fixar: document.getElementById('btnFixar'),
    desligar: document.getElementById('btnDesligar')
};

const estado = {
    ligado: false,
    stream: null,
    seguindo: false,    // Modo seguir: acompanha o copo
    x: 0, y: 0,
    visivel: false,
    largura: 0, altura: 0
};

// 🔴 PERFIL DA PEDRINHA
const PEDRINHA = {
    rMin: 145, rMax: 255,
    gMin: 0,   gMax: 110,
    bMin: 0,   bMax: 110,
    pesoVermelho: 2.2,
    minPts: 2,
    maxPts: 180,
    passo: 3
};

btn.ligar.addEventListener('click', async () => {
    try {
        estado.stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: 'environment',
                width: { ideal: 640 },
                height: { ideal: 480 },
                frameRate: { ideal: 30 }
            }
        });
        video.srcObject = estado.stream;
        await video.play();
        
        estado.largura = canvas.width = video.videoWidth;
        estado.altura = canvas.height = video.videoHeight;
        estado.ligado = true;
        estado.seguindo = false;
        
        infoEl.innerHTML = `<div class="ativo">✅ SISTEMA ATIVO — mostre a pedrinha</div>`;
        btn.ligar.disabled = true;
        btn.fixar.disabled = true;
        btn.desligar.disabled = false;
        
        loop();
        
    } catch {
        infoEl.innerHTML = `<div style="color:#ef4444">❌ Permita a câmera</div>`;
    }
});

// 🎯 ATIVA O SEGUIMENTO — não trava, acompanha!
btn.fixar.addEventListener('click', () => {
    if (!estado.visivel) return;
    
    estado.seguindo = true;
    btn.fixar.disabled = true;
    btn.fixar.textContent = "✅ ACOMPANHANDO";
    
    infoEl.innerHTML = `<div class="ativo">🎯 SEGUINDO O MOVIMENTO — a caixa vai junto!</div>`;
});

function loop() {
    if (!estado.ligado) return;
    
    ctx.clearRect(0, 0, estado.largura, estado.altura);
    ctx.drawImage(video, 0, 0, estado.largura, estado.altura);
    
    const achou = detectar();
    
    if (achou) {
        estado.x = achou.x;
        estado.y = achou.y;
        estado.visivel = true;
        
        // 📐 Calcula qual copo e POSICIONA a CAIXA
        const larguraTotal = estado.largura;
        let posEsq, posDir;
        
        if (estado.x < larguraTotal / 3) {
            // Copo 1
            posEsq = 0;
            posDir = (larguraTotal / 3) / larguraTotal * 100;
        } else if (estado.x < (larguraTotal * 2) / 3) {
            // Copo 2
            posEsq = (larguraTotal / 3) / larguraTotal * 100;
            posDir = (larguraTotal * 2 / 3) / larguraTotal * 100;
        } else {
            // Copo 3
            posEsq = (larguraTotal * 2 / 3) / larguraTotal * 100;
            posDir = 100;
        }
        
        // ✅ COLOCAR CAIXA EXATAMENTE EM CIMA DO COPO — SEMPRE JUNTO
        marcadorEl.style.display = 'block';
        marcadorEl.style.left = `${posEsq}%`;
        marcadorEl.style.right = `${100 - posDir}%`;
        
        if (!estado.seguindo) {
            infoEl.innerHTML = `<div class="ativo">👁️ PEDRINHA DETECTADA — clique SEGUIR</div>`;
            btn.fixar.disabled = false;
        }
        
    } else {
        estado.visivel = false;
        
        if (!estado.seguindo) {
            marcadorEl.style.display = 'none';
            infoEl.innerHTML = `<div class="esperando">👀 Pedrinha fora de vista — mostre novamente</div>`;
            btn.fixar.disabled = true;
        }
        // Se já ativou o SEGUIR, NÃO ESCONDE — mantém a última posição conhecida
    }
    
    requestAnimationFrame(loop);
}

// 🔍 DETECÇÃO RÁPIDA
function detectar() {
    const img = ctx.getImageData(0, 0, estado.largura, estado.altura);
    const d = img.data;
    
    let total = 0, somaX = 0, somaY = 0;
    
    for (let i = 0; i < d.length; i += 4 * PEDRINHA.passo) {
        const r = d[i], g = d[i+1], b = d[i+2];
        
        if (r < PEDRINHA.rMin || r > PEDRINHA.rMax) continue;
        if (g > PEDRINHA.gMax) continue;
        if (b > PEDRINHA.bMax) continue;
        if (r <= g * PEDRINHA.pesoVermelho || r <= b * PEDRINHA.pesoVermelho) continue;
        
        total++;
        const idx = i / 4;
        somaX += idx % estado.largura;
        somaY += Math.floor(idx / estado.largura);
    }
    
    if (total >= PEDRINHA.minPts && total <= PEDRINHA.maxPts) {
        return {
            x: somaX / total,
            y: somaY / total
        };
    }
    return null;
}

btn.desligar.addEventListener('click', () => {
    if (estado.stream) estado.stream.getTracks().forEach(t => t.stop());
    
    estado.ligado = false;
    estado.seguindo = false;
    estado.x = estado.y = 0;
    estado.visivel = false;
    estado.stream = null;
    
    video.srcObject = null;
    ctx.clearRect(0, 0, estado.largura, estado.altura);
    marcadorEl.style.display = 'none';
    
    infoEl.innerHTML = `<div class="esperando">Ligue e mostre a pedrinha</div>`;
    btn.ligar.disabled = false;
    btn.fixar.disabled = true;
    btn.fixar.textContent = "🎯 SEGUIR";
    btn.desligar.disabled = true;
});
</script>
</body>
</html>
