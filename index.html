<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LISBON — HACKER STYLE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: white; }
        
        .camera-container { position: fixed; inset: 0; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(1); }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        /* 🟱 ÁREAS DOS COPOS — invisíveis, só referência */
        .copos { position: fixed; inset: 0; display: flex; pointer-events: none; z-index: 5; }
        .copo-zone { flex: 1; position: relative; }
        
        /* 💻 TEXTO HACKER — exatamente igual à imagem */
        .hack-label {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #4ade80;
            z-index: 30;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.3);
        }
        
        /* 🟦 CAIXA AZUL DESTAQUE — igual ao exemplo */
        .hack-box {
            position: absolute;
            top: 15%;
            left: 10%;
            right: 10%;
            bottom: 15%;
            background: rgba(59, 130, 246, 0.25);
            border: 3px solid #3b82f6;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5), inset 0 0 15px rgba(59, 130, 246, 0.2);
            animation: brilho 1.2s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 15;
        }
        
        @keyframes brilho {
            from { box-shadow: 0 0 25px rgba(59, 130, 246, 0.5), inset 0 0 15px rgba(59, 130, 246, 0.2); }
            to { box-shadow: 0 0 35px rgba(59, 130, 246, 0.7), inset 0 0 20px rgba(59, 130, 246, 0.35); }
        }
        
        .info {
            position: fixed;
            bottom: 90px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 30;
            padding: 10px;
            font-size: 1rem;
            background: rgba(0,0,0,0.6);
        }
        .ativo { color: #4ade80; text-shadow: 0 0 8px rgba(74,222,128,0.5); }
        .esperando { color: #fbbf24; }
        
        .botoes {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            padding: 15px;
            background: linear-gradient(to top, #000 70%, transparent);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        button {
            padding: 14px 8px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .ligar { background: #16a34a; color: #000; }
        .marcar { background: #3b82f6; color: #fff; }
        .desligar { background: #1f2937; border: 2px solid #ef4444; color: #fff; }
    </style>
</head>
<body>

<!-- 💻 TEXTO HACKER — IGUALZINHO AO EXEMPLO -->
<div class="hack-label">button.thimbles-game__thimble 99 = 333 69</div>

<!-- 🟦 ÁREAS DOS COPOS -->
<div class="copos">
    <div class="copo-zone" id="z1">
        <div class="hack-box" id="box1" style="display:none;"></div>
    </div>
    <div class="copo-zone" id="z2">
        <div class="hack-box" id="box2" style="display:none;"></div>
    </div>
    <div class="copo-zone" id="z3">
        <div class="hack-box" id="box3" style="display:none;"></div>
    </div>
</div>

<div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<div id="info" class="info">
    <div class="esperando">Ligue → mostre a pedrinha vermelha</div>
</div>

<div class="botoes">
    <button id="btnLigar" class="ligar">🔘 LIGAR</button>
    <button id="btnMarcar" class="marcar" disabled>🎯 MARCAR</button>
    <button id="btnDesligar" class="desligar" disabled>⭕ DESLIGAR</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: false });
const infoEl = document.getElementById('info');

const box = {
    1: document.getElementById('box1'),
    2: document.getElementById('box2'),
    3: document.getElementById('box3')
};

const btn = {
    ligar: document.getElementById('btnLigar'),
    marcar: document.getElementById('btnMarcar'),
    desligar: document.getElementById('btnDesligar')
};

const estado = {
    ligado: false,
    stream: null,
    travado: false,
    copoAtual: 0,
    copoFinal: 0,
    x: 0,
    y: 0,
    visivel: false,
    largura: 0,
    altura: 0
};

// 🔴 PERFIL EXATO DA PEDRINHA
const PEDRINHA = {
    rMin: 145, rMax: 255,
    gMin: 0,   gMax: 110,
    bMin: 0,   bMax: 110,
    pesoVermelho: 2.2,
    minPts: 2,
    maxPts: 180,
    passo: 3
};

btn.ligar.addEventListener('click', async () => {
    try {
        estado.stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: 'environment',
                width: { ideal: 640 },
                height: { ideal: 480 },
                frameRate: { ideal: 30 }
            }
        });
        video.srcObject = estado.stream;
        await video.play();
        
        estado.largura = canvas.width = video.videoWidth;
        estado.altura = canvas.height = video.videoHeight;
        estado.ligado = true;
        estado.travado = false;
        
        infoEl.innerHTML = `<div class="ativo">✅ SISTEMA ATIVO — mostre a pedrinha</div>`;
        btn.ligar.disabled = true;
        btn.marcar.disabled = true;
        btn.desligar.disabled = false;
        
        loop();
        
    } catch {
        infoEl.innerHTML = `<div style="color:#ef4444">❌ Permita a câmera</div>`;
    }
});

// 🎯 TRAVA A CAIXA — confirmação final
btn.marcar.addEventListener('click', () => {
    if (!estado.copoAtual || estado.travado) return;
    
    estado.travado = true;
    estado.copoFinal = estado.copoAtual;
    
    // Mostra SÓ a caixa certa
    for (let i = 1; i <= 3; i++) {
        box[i].style.display = i === estado.copoFinal ? 'block' : 'none';
    }
    
    infoEl.innerHTML = `<div class="ativo">✅ CONFIRMADO — COPO ${estado.copoFinal}</div>`;
    btn.marcar.disabled = true;
    btn.marcar.textContent = "✅ FIXADO";
});

function loop() {
    if (!estado.ligado) return;
    
    ctx.clearRect(0, 0, estado.largura, estado.altura);
    ctx.drawImage(video, 0, 0, estado.largura, estado.altura);
    
    // Se já travou, mantém só a caixa confirmada
    if (estado.travado) {
        requestAnimationFrame(loop);
        return;
    }
    
    // 🔍 DETECÇÃO EM TEMPO REAL
    const achou = detectar();
    
    if (achou) {
        estado.x = achou.x;
        estado.y = achou.y;
        estado.visivel = true;
        
        // Define qual copo
        if (estado.x < estado.largura / 3) {
            estado.copoAtual = 1;
        } else if (estado.x < estado.largura * 2 / 3) {
            estado.copoAtual = 2;
        } else {
            estado.copoAtual = 3;
        }
        
        // 🔵 CAIXA AZUL SEGUE EM TEMPO REAL
        for (let i = 1; i <= 3; i++) {
            box[i].style.display = i === estado.copoAtual ? 'block' : 'none';
        }
        
        infoEl.innerHTML = `<div class="ativo">👁️ PEDRINHA NO COPO ${estado.copoAtual} → clique MARCAR</div>`;
        btn.marcar.disabled = false;
        
    } else {
        estado.visivel = false;
        estado.copoAtual = 0;
        
        // Esconde todas se não vir
        for (let i = 1; i <= 3; i++) box[i].style.display = 'none';
        
        infoEl.innerHTML = `<div class="esperando">👀 Pedrinha fora de vista — mostre novamente</div>`;
        btn.marcar.disabled = true;
    }
    
    requestAnimationFrame(loop);
}

// 🔍 DETECÇÃO PURA — SEM ATRASO
function detectar() {
    const img = ctx.getImageData(0, 0, estado.largura, estado.altura);
    const d = img.data;
    
    let total = 0, somaX = 0, somaY = 0;
    
    for (let i = 0; i < d.length; i += 4 * PEDRINHA.passo) {
        const r = d[i], g = d[i+1], b = d[i+2];
        
        if (r < PEDRINHA.rMin || r > PEDRINHA.rMax) continue;
        if (g > PEDRINHA.gMax) continue;
        if (b > PEDRINHA.bMax) continue;
        if (r <= g * PEDRINHA.pesoVermelho || r <= b * PEDRINHA.pesoVermelho) continue;
        
        total++;
        const idx = i / 4;
        somaX += idx % estado.largura;
        somaY += Math.floor(idx / estado.largura);
    }
    
    if (total >= PEDRINHA.minPts && total <= PEDRINHA.maxPts) {
        return {
            x: somaX / total,
            y: somaY / total
        };
    }
    return null;
}

btn.desligar.addEventListener('click', () => {
    if (estado.stream) estado.stream.getTracks().forEach(t => t.stop());
    
    estado.ligado = false;
    estado.travado = false;
    estado.copoAtual = estado.copoFinal = 0;
    estado.x = estado.y = 0;
    estado.visivel = false;
    estado.stream = null;
    
    video.srcObject = null;
    ctx.clearRect(0, 0, estado.largura, estado.altura);
    
    for (let i = 1; i <= 3; i++) box[i].style.display = 'none';
    
    infoEl.innerHTML = `<div class="esperando">Ligue e mostre a pedrinha</div>`;
    btn.ligar.disabled = false;
    btn.marcar.disabled = true;
    btn.marcar.textContent = "🎯 MARCAR";
    btn.desligar.disabled = true;
});
</script>
</body>
</html>
