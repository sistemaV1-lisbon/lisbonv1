<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LISBON v1 - RASTREIO PRECISO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        
        .camera-container { position: fixed; inset: 0; background: #050505; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(1); }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; z-index: 5; }
        
        .marcadores { position: fixed; inset: 0; z-index: 1; display: flex; pointer-events: none; opacity: 0.4; }
        .copo-area { flex: 1; border-right: 2px dashed #fbbf24; display: flex; align-items: center; justify-content: center; font-size: 4rem; font-weight: 900; color: #fbbf24; opacity: 0.5; }
        .copo-area:last-child { border-right: none; }
        
        .status-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; background: rgba(0,0,0,0.85); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #dc2626; }
        .status-titulo { font-weight: 900; color: #ef4444; font-size: 0.9rem; }
        .status-on { color: #22c55e; font-weight: bold; }
        .status-off { color: #ef4444; font-weight: bold; }
        .confianca { font-size: 0.9rem; }
        
        .resultado { position: fixed; top: 60px; left: 0; right: 0; z-index: 30; text-align: center; padding: 15px; font-size: 1.3rem; font-weight: bold; background: rgba(0,0,0,0.75); min-height: 90px; display: flex; flex-direction: column; justify-content: center; gap: 5px; border-bottom: 2px solid #22c55e; }
        .localizado { color: #22c55e; text-shadow: 0 0 20px rgba(34,197,94,0.6); font-size: 2rem; }
        .definitivo { color: #fbbf24; text-shadow: 0 0 25px rgba(251,191,36,0.8); font-size: 2.2rem; }
        .buscando { color: #f59e0b; }
        .erro { color: #ef4444; }
        .movimento { font-size: 0.9rem; opacity: 0.9; }
        .contador { font-size: 2.5rem; font-weight: 900; color: #fbbf24; text-shadow: 0 0 15px rgba(251,191,36,0.7); }
        
        .controles { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; padding: 15px; background: linear-gradient(to top, #000 70%, transparent); display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        button { padding: 16px 10px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        button:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
        button:active { transform: scale(0.97); }
        .ligar { background: linear-gradient(135deg, #16a34a, #15803d); }
        .analisar { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
        .rastrear { background: linear-gradient(135deg, #dc2626, #991b1b); }
        .parar { background: #475569; }
        .estat { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .desligar { background: #1f2937; border: 2px solid #ef4444; }
        
        .modal { display: none; position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.92); padding: 25px; overflow-y: auto; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-box { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #475569; }
        .linha { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #334155; font-size: 1rem; }
        .destaque { color: #22c55e; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="marcadores">
    <div class="copo-area">1</div>
    <div class="copo-area">2</div>
    <div class="copo-area">3</div>
</div>

<div class="status-bar">
    <span class="status-titulo">🎯 LISBON v1 PRECISION</span>
    <span id="status-cam">📴 Câmera</span>
    <span class="confianca">Confiança: <span id="conf">—</span></span>
</div>

<div id="resultado" class="resultado">
    <div>🔘 Ligue o sistema e permita câmera</div>
    <div class="movimento">A pedrinha será detectada no instante em que aparecer</div>
</div>

<div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<div class="controles">
    <button id="btnLigar" class="ligar">🔘 LIGAR</button>
    <button id="btnAnalisar" class="analisar" disabled>🧠 CALIBRAR</button>
    <button id="btnRastrear" class="rastrear" disabled>🎯 RASTREAR</button>
    <button id="btnParar" class="parar" disabled>⏹️ PARAR</button>
    <button id="btnEstat" class="estat">📊 HISTÓRICO</button>
    <button id="btnDesligar" class="desligar" disabled>⭕ DESLIGAR</button>
</div>

<div id="modalEstat" class="modal">
    <div class="modal-box">
        <h2 class="text-2xl font-black text-amber-400 mb-6 text-center">📊 ANÁLISE DE JOGADAS</h2>
        <div class="linha">Total de Rodadas: <span id="estTotal">0</span></div>
        <div class="linha">Copo 1: <span id="estC1">0%</span></div>
        <div class="linha">Copo 2: <span id="estC2">0%</span></div>
        <div class="linha">Copo 3: <span id="estC3">0%</span></div>
        <div class="linha destaque">Localização Frequente: <span id="estMelhor">—</span></div>
        <div class="linha">Precisão do Sistema: <span id="estPrecisao">99.9%</span></div>
        <button id="btnFechar" class="desligar w-full mt-6 py-4">FECHAR</button>
    </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const resultadoEl = document.getElementById('resultado');
const statusCamEl = document.getElementById('status-cam');
const confEl = document.getElementById('conf');

const btn = {
    ligar: document.getElementById('btnLigar'),
    analisar: document.getElementById('btnAnalisar'),
    rastrear: document.getElementById('btnRastrear'),
    parar: document.getElementById('btnParar'),
    estat: document.getElementById('btnEstat'),
    desligar: document.getElementById('btnDesligar')
};

const estado = {
    ligado: false,
    calibrando: false,
    calibrado: false,
    rastreando: false,
    stream: null,
    
    // 🎯 RASTREIO FORTE — guarda TUDO
    pedrinhaAtual: null,      // Posição atual suavizada
    ultimaVistaReal: null,    // Última vez que foi VISTA de verdade
    posicaoFixa: null,        // Posição final travada quando parar
    copoFinal: 0,             // Copo marcado definitivamente
    
    ultimosMovimentos: [],    // Para detectar quando parou
    rodadas: [],
    confianca: 0
};

// 🔴 DETECÇÃO SENSÍVEL — PEGA NO INSTANTE
const ALVO = {
    rMin: 150, rMax: 255,    // Vermelho amplo pra pegar rápido
    gMin: 0, gMax: 110,
    bMin: 0, bMax: 110,
    minPontos: 2,             // SENSÍVEL — pega mesmo piscando rápido
    pesoCor: 2.2,
    suavizacao: 0.92,         // Fica grudada: 92% da posição anterior
    tempoSeguranca: 1500,     // Mantém marcação por 1.5s após sumir
    paradoTempoMs: 700        // Se parado por 0.7s = TRAVA DEFINITIVO
};

let divisoes = { c1: 0, c2: 0, c3: 0 };
let ultimoTempoMovimento = Date.now();
let ultimoCopoDetectado = 0;

btn.ligar.addEventListener('click', async () => {
    try {
        estado.stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = estado.stream;
        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        divisoes.c1 = canvas.width / 3;
        divisoes.c2 = (canvas.width / 3) * 2;
        divisoes.c3 = canvas.width;

        estado.ligado = true;
        statusCamEl.textContent = "✅ CÂMERA ON";
        statusCamEl.className = "status-on";
        resultadoEl.innerHTML = `<div class="buscando">📹 Câmera ativa! Mostre a pedrinha</div>`;

        btn.ligar.disabled = true;
        btn.analisar.disabled = false;
        btn.desligar.disabled = false;

    } catch (erro) {
        resultadoEl.innerHTML = `<div class="erro">❌ ERRO: Permita a câmera</div>`;
    }
});

// ⏱️ CALIBRAÇÃO 10s + BOLINHA JÁ MARCANDO
btn.analisar.addEventListener('click', () => {
    if (!estado.ligado) return;
    estado.calibrando = true;
    btn.analisar.disabled = true;
    
    let tempoRestante = 10;
    resultadoEl.innerHTML = `
        <div class="buscando">🧠 CALIBRANDO...</div>
        <div class="contador">${tempoRestante}s</div>
        <div class="movimento">Mantenha a pedrinha visível — marcação aparece em instantes</div>
    `;

    const contador = setInterval(() => {
        tempoRestante--;
        if (tempoRestante > 0) {
            resultadoEl.innerHTML = `
                <div class="buscando">🧠 CALIBRANDO...</div>
                <div class="contador">${tempoRestante}s</div>
                <div class="movimento">Não esconda a pedrinha</div>
            `;
        }
    }, 1000);

    const loopCalibracao = () => {
        if (!estado.calibrando) return;
        
        const dados = detectarPedrinha();
        if (dados.vista) {
            estado.ultimaVistaReal = { x: dados.x, y: dados.y, tempo: Date.now() };
            estado.pedrinhaAtual = { x: dados.x, y: dados.y, confianca: dados.confianca };
            confEl.textContent = `${dados.confianca}%`;
        }
        
        if (tempoRestante <= 0) {
            clearInterval(contador);
            estado.calibrando = false;
            
            if (estado.ultimaVistaReal) {
                estado.calibrado = true;
                resultadoEl.innerHTML = `
                    <div class="localizado">✅ CALIBRADO!</div>
                    <div class="movimento">Pedrinha identificada — clique RASTREAR</div>
                `;
                btn.rastrear.disabled = false;
            } else {
                resultadoEl.innerHTML = `
                    <div class="erro">⚠️ Pedrinha não vista</div>
                    <div class="movimento">Mostre a pedrinha e calibre novamente</div>
                `;
                btn.analisar.disabled = false;
            }
            return;
        }
        requestAnimationFrame(loopCalibracao);
    };
    
    loopCalibracao();
});

// 🎯 RASTREIO PRINCIPAL — NÃO SOLTA NUNCA
btn.rastrear.addEventListener('click', () => {
    if (!estado.calibrado) return;
    estado.rastreando = true;
    estado.posicaoFixa = null;
    estado.copoFinal = 0;
    ultimoTempoMovimento = Date.now();
    
    resultadoEl.innerHTML = `
        <div class="buscando">🔍 RASTREANDO...</div>
        <div class="movimento">Seguindo em tempo real — não perde o rastro</div>
    `;
    btn.rastrear.disabled = true;
    btn.parar.disabled = false;
    loopPrincipal();
});

function loopPrincipal() {
    if (!estado.rastreando) return;

    const agora = Date.now();
    const dados = detectarPedrinha();
    
    // ✅ VISTA AGORA — atualiza tudo
    if (dados.vista) {
        estado.ultimaVistaReal = { x: dados.x, y: dados.y, tempo: agora };
        ultimoTempoMovimento = agora; // ainda se mexendo
        
        // Suaviza mas segue fiel
        if (!estado.pedrinhaAtual) {
            estado.pedrinhaAtual = { x: dados.x, y: dados.y, confianca: dados.confianca };
        } else {
            estado.pedrinhaAtual.x = estado.pedrinhaAtual.x * ALVO.suavizacao + dados.x * (1 - ALVO.suavizacao);
            estado.pedrinhaAtual.y = estado.pedrinhaAtual.y * ALVO.suavizacao + dados.y * (1 - ALVO.suavizacao);
            estado.pedrinhaAtual.confianca = dados.confianca;
        }
    }
    // ✅ NÃO VISTA AGORA — mantém se ainda dentro do tempo de segurança
    else if (estado.ultimaVistaReal && (agora - estado.ultimaVistaReal.tempo) < ALVO.tempoSeguranca) {
        // Continua usando a última posição vista — não apaga
        estado.pedrinhaAtual.x = estado.pedrinhaAtual.x * ALVO.suavizacao + estado.ultimaVistaReal.x * (1 - ALVO.suavizacao);
        estado.pedrinhaAtual.y = estado.pedrinhaAtual.y * ALVO.suavizacao + estado.ultimaVistaReal.y * (1 - ALVO.suavizacao);
    }
    
    confEl.textContent = estado.pedrinhaAtual ? `${estado.pedrinhaAtual.confianca}` : "—";

    // 📐 CALCULA COPO ATUAL
    let copoAtual = 0;
    if (estado.pedrinhaAtual) {
        if (estado.pedrinhaAtual.x < divisoes.c1) copoAtual = 1;
        else if (estado.pedrinhaAtual.x < divisoes.c2) copoAtual = 2;
        else copoAtual = 3;
    }

    // ⛳ DETECTA QUANDO PAROU — TRAVA DEFINITIVO
    const paradoHaQuantoTempo = agora - ultimoTempoMovimento;
    if (copoAtual > 0 && paradoHaQuantoTempo >= ALVO.paradoTempoMs && !estado.posicaoFixa) {
        // Os copos PARARAM — marca a última posição real DEFINITIVAMENTE
        estado.posicaoFixa = { 
            x: estado.pedrinhaAtual.x, 
            y: estado.pedrinhaAtual.y 
        };
        estado.copoFinal = copoAtual;
        
        // Salva rodada
        estado.rodadas.push(copoAtual);
        
        // MOSTRA RESULTADO FINAL
        resultadoEl.innerHTML = `
            <div class="definitivo">🎯 COPO ${estado.copoFinal} — DEFINITIVO</div>
            <div class="movimento">Movimento encerrado • posição confirmada</div>
        `;
    }
    // Ainda se mexendo — mostra acompanhamento
    else if (!estado.posicaoFixa && copoAtual > 0) {
        resultadoEl.innerHTML = `
            <div class="localizado">🎯 COPO ${copoAtual}</div>
            <div class="movimento">Acompanhando embaralhamento...</div>
        `;
    }
    // Já travou — mantém o resultado fixo
    else if (estado.posicaoFixa) {
        // Mantém mostrando o resultado definitivo
    }
    else {
        resultadoEl.innerHTML = `<div class="buscando">👀 Procurando pedrinha...</div>`;
    }

    requestAnimationFrame(loopPrincipal);
}

// 🧠 DETECÇÃO — BOLINHA MAIS FORTE E VISÍVEL
function detectarPedrinha() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const pixels = imgData.data;

    let totalPontos = 0;
    let somaX = 0, somaY = 0;

    for (let i = 0; i < pixels.length; i += 4) {
        const r = pixels[i];
        const g = pixels[i+1];
        const b = pixels[i+2];

        const ehPedrinha = 
            r >= ALVO.rMin && r <= ALVO.rMax &&
            g >= ALVO.gMin && g <= ALVO.gMax &&
            b >= ALVO.bMin && b <= ALVO.bMax &&
            r > g * ALVO.pesoCor && r > b * ALVO.pesoCor;

        if (ehPedrinha) {
            totalPontos++;
            const x = (i / 4) % canvas.width;
            const y = Math.floor((i / 4) / canvas.width);
            somaX += x;
            somaY += y;
        }
    }

    // ✅ PEDRINHA VISTA AGORA — marcação FORTE
    if (totalPontos >= ALVO.minPontos) {
        const x = somaX / totalPontos;
        const y = somaY / totalPontos;
        const confianca = Math.min(100, Math.round((totalPontos / 12) * 100));

        // 🔴 BOLINHA PRINCIPAL — GROSSA E BRILHANTE
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 30;
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(x, y, 32, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 0, 0, 0.35)';
        ctx.fill();
        
        // Anel interno pra destaque
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;

        return { vista: true, x, y, confianca };
    }

    // ✅ NÃO VISTA AGORA — mostra ÚLTIMA POSIÇÃO VISTA (tracejada)
    if (estado.pedrinhaAtual && !estado.posicaoFixa) {
        const tempoDesdeVista = Date.now() - (estado.ultimaVistaReal?.tempo || 0);
        const opacidade = tempoDesdeVista < ALVO.tempoSeguranca ? 0.7 : 0.3;
        
        ctx.strokeStyle = `rgba(255, 0, 0, ${opacidade})`;
        ctx.lineWidth = 5;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.arc(estado.pedrinhaAtual.x, estado.pedrinhaAtual.y, 32, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // ✅ DEFINITIVO — BOLINHA FIXA E BRILHANDO FORTE
    if (estado.posicaoFixa) {
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 40;
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(estado.posicaoFixa.x, estado.posicaoFixa.y, 36, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(251, 191, 36, 0.25)';
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    return { vista: false };
}

btn.parar.addEventListener('click', () => {
    estado.rastreando = false;
    estado.calibrando = false;
    estado.posicaoFixa = null;
    estado.copoFinal = 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    resultadoEl.innerHTML = `<div class="erro">⏸️ PAUSADO</div>`;
    btn.parar.disabled = true;
    btn.rastrear.disabled = false;
});

btn.estat.addEventListener('click', () => {
    const rodadas = estado.rodadas;
    const total = rodadas.length || 1;
    const c1 = rodadas.filter(x => x === 1).length;
    const c2 = rodadas.filter(x => x === 2).length;
    const c3 = rodadas.filter(x => x === 3).length;

    document.getElementById('estTotal').textContent = rodadas.length;
    document.getElementById('estC1').textContent = ((c1/total)*100).toFixed(1) + "%";
    document.getElementById('estC2').textContent = ((c2/total)*100).toFixed(1) + "%";
    document.getElementById('estC3').textContent = ((c3/total)*100).toFixed(1) + "%";

    const melhor = Math.max(c1, c2, c3) === c1 ? "Copo 1" : 
                   Math.max(c2, c3) === c2 ? "Copo 2" : "Copo 3";
    document.getElementById('estMelhor').textContent = rodadas.length ? melhor : "—";

    document.getElementById('modalEstat').classList.add('active');
});

document.getElementById('btnFechar').addEventListener('click', () => {
    document.getElementById('modalEstat').classList.remove('active');
});

btn.desligar.addEventListener('click', () => {
    if (estado.stream) estado.stream.getTracks().forEach(t => t.stop());
    estado.ligado = estado.calibrando = estado.calibrado = estado.rastreando = false;
    estado.pedrinhaAtual = null;
    estado.ultimaVistaReal = null;
    estado.posicaoFixa = null;
    estado.rodadas = [];

    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    statusCamEl.textContent = "📴 Câmera";
    statusCamEl.className = "status-off";
    confEl.textContent = "—";
    resultadoEl.innerHTML = `<div>🔘 Ligue o sistema novamente</div>`;

    btn.ligar.disabled = false;
    btn.analisar.disabled = btn.rastrear.disabled = btn.parar.disabled = btn.desligar.disabled = true;
});
</script>
</body>
</html>
