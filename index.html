<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LISBON — RASTREIO PURO v2.2 FOTO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        
        .camera-container { position: fixed; inset: 0; background: #050505; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(1); will-change: transform; }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; z-index: 10; will-change: transform; }
        
        .divisores { position: fixed; inset: 0; z-index: 1; display: flex; pointer-events: none; opacity: 0.3; }
        .parte { flex: 1; border-right: 1px dashed #666; }
        .parte:last-child { border-right: none; }
        
        .topo { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: rgba(0,0,0,0.8); padding: 12px; text-align: center; border-bottom: 2px solid #ef4444; }
        .titulo { font-weight: 900; font-size: 1.1rem; color: #ef4444; }
        .status { margin-top: 4px; font-size: 0.9rem; }
        .pronta { color: #22c55e; }
        .aguardando { color: #f59e0b; }
        
        .info { position: fixed; top: 70px; left: 0; right: 0; z-index: 20; text-align: center; padding: 10px; font-size: 1rem; background: rgba(0,0,0,0.6); }
        .mensagem { color: #ddd; }
        .fixada { color: #fbbf24; font-weight: bold; font-size: 1.1rem; text-shadow: 0 0 10px rgba(251,191,36,0.5); }
        
        .botoes { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; padding: 20px; background: linear-gradient(to top, #000 70%, transparent); display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        button { padding: 18px 10px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        button:active { transform: scale(0.97); }
        .ligar { background: linear-gradient(135deg, #16a34a, #15803d); }
        .marcar { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
        .desligar { background: #1f2937; border: 2px solid #ef4444; }
    </style>
</head>
<body>

<div class="divisores">
    <div class="parte"></div>
    <div class="parte"></div>
    <div class="parte"></div>
</div>

<div class="topo">
    <div class="titulo">🎯 LISBON — RASTREIO PURO</div>
    <div id="status" class="status aguardando">Câmera desligada</div>
</div>

<div id="info" class="info">
    <div class="mensagem">Ligue e mostre a pedrinha vermelha para fixar</div>
</div>

<div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<div class="botoes">
    <button id="btnLigar" class="ligar">🔘 LIGAR</button>
    <button id="btnMarcar" class="marcar" disabled>🎯 FIXAR PEDRINHA</button>
    <button id="btnDesligar" class="desligar" disabled>⭕ DESLIGAR</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { 
    willReadFrequently: true,
    alpha: false
});
const statusEl = document.getElementById('status');
const infoEl = document.getElementById('info');

const btn = {
    ligar: document.getElementById('btnLigar'),
    marcar: document.getElementById('btnMarcar'),
    desligar: document.getElementById('btnDesligar')
};

const estado = {
    ligado: false,
    stream: null,
    pedrinhaFixada: false,
    ultimaX: 0,
    ultimaY: 0,
    confianca: 0,
    ultimoTempo: 0,
    largura: 0,
    altura: 0
};

// 🔴 COR AJUSTADA EXATAMENTE PELAS FOTOS
const COR = {
    // Pedrinha vermelha brilhante — valores calibrados
    rMin: 140, rMax: 255,      // Vermelho forte
    gMin: 0, gMax: 120,        // Pouco verde
    bMin: 0, bMax: 120,        // Pouco azul
    minPontos: 2,              // Detecta rápido
    maxPontos: 200,            // Ignora manchas grandes
    pesoVermelho: 2.2,         // Vermelho dominante
    suavidade: 0.65,           // Firme mas rápido
    segurancaMs: 3000,         // Mantém rastro 3s sem ver
    passo: 3,                  // Equilíbrio velocidade/precisão
    tamanhoEsperado: 80        // Tamanho aproximado da pedrinha
};

btn.ligar.addEventListener('click', async () => {
    try {
        estado.stream = await navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: 'environment', 
                width: { ideal: 960 },
                height: { ideal: 540 },
                frameRate: { ideal: 30 }
            }
        });
        video.srcObject = estado.stream;
        await video.play();
        
        estado.largura = canvas.width = video.videoWidth;
        estado.altura = canvas.height = video.videoHeight;
        
        estado.ligado = true;
        statusEl.textContent = "✅ CÂMERA LIGADA — mostre a pedrinha";
        statusEl.className = "status pronta";
        infoEl.innerHTML = `<div class="mensagem">Mostre a pedrinha vermelha → clique FIXAR</div>`;
        
        btn.ligar.disabled = true;
        btn.marcar.disabled = false;
        btn.desligar.disabled = false;
        
        loopPrincipal();
        
    } catch (erro) {
        infoEl.innerHTML = `<div style="color:#ef4444">❌ Permita a câmera nas configurações</div>`;
    }
});

btn.marcar.addEventListener('click', () => {
    if (!estado.ligado) return;
    
    const detectada = procurarPedrinha();
    if (detectada) {
        estado.pedrinhaFixada = true;
        estado.ultimaX = detectada.x;
        estado.ultimaY = detectada.y;
        
        infoEl.innerHTML = `<div class="fixada">✅ PEDRINHA FIXADA — NÃO SOLTA MAIS!</div>`;
        btn.marcar.disabled = true;
        btn.marcar.textContent = "✅ FIXADA";
    } else {
        infoEl.innerHTML = `<div style="color:#f59e0b">⚠️ Mostre a pedrinha e clique novamente</div>`;
    }
});

function loopPrincipal() {
    if (!estado.ligado) return;
    
    const agora = performance.now();
    
    ctx.clearRect(0, 0, estado.largura, estado.altura);
    ctx.drawImage(video, 0, 0, estado.largura, estado.altura);
    
    const vistaAgora = procurarPedrinha();
    
    if (vistaAgora) {
        if (estado.pedrinhaFixada) {
            // Rastreio responsivo: movimento rápido = responde rápido
            const dist = Math.hypot(vistaAgora.x - estado.ultimaX, vistaAgora.y - estado.ultimaY);
            const fator = dist > 60 ? 0.5 : COR.suavidade;
            
            estado.ultimaX = estado.ultimaX * fator + vistaAgora.x * (1 - fator);
            estado.ultimaY = estado.ultimaY * fator + vistaAgora.y * (1 - fator);
        } else {
            estado.ultimaX = vistaAgora.x;
            estado.ultimaY = vistaAgora.y;
        }
        estado.confianca = vistaAgora.conf;
        estado.ultimoTempo = agora;
        
        statusEl.textContent = `✅ Vendo pedrinha — Confiança: ${estado.confianca}%`;
        statusEl.className = "status pronta";
        
    } else if (estado.pedrinhaFixada) {
        const semVer = agora - estado.ultimoTempo;
        if (semVer < COR.segurancaMs) {
            statusEl.textContent = "👀 Pedrinha fora de vista — mantendo rastro...";
        } else {
            statusEl.textContent = "⚠️ Rastro mantido — aguardando reaparecer";
        }
        statusEl.className = "status aguardando";
    }
    
    if (estado.ultimaX !== 0 || estado.ultimaY !== 0) {
        desenharBolinha(estado.ultimaX, estado.ultimaY, estado.pedrinhaFixada);
    }
    
    requestAnimationFrame(loopPrincipal);
}

// 🔍 DETECÇÃO CALIBRADA PELAS FOTOS
function procurarPedrinha() {
    const imgData = ctx.getImageData(0, 0, estado.largura, estado.altura);
    const dados = imgData.data;
    
    let total = 0;
    let somaX = 0, somaY = 0;
    
    for (let i = 0; i < dados.length; i += 4 * COR.passo) {
        const r = dados[i];
        const g = dados[i + 1];
        const b = dados[i + 2];
        
        // Filtro exato da pedrinha das fotos
        if (r < COR.rMin || r > COR.rMax) continue;
        if (g > COR.gMax) continue;
        if (b > COR.bMax) continue;
        if (r <= g * COR.pesoVermelho || r <= b * COR.pesoVermelho) continue;
        
        total++;
        const idx = i / 4;
        const x = idx % estado.largura;
        const y = (idx / estado.largura) | 0;
        
        somaX += x;
        somaY += y;
    }
    
    // Tamanho correto da pedrinha
    if (total >= COR.minPontos && total <= COR.maxPontos) {
        return {
            x: somaX / total,
            y: somaY / total,
            conf: Math.min(100, Math.round((total / COR.tamanhoEsperado) * 100))
        };
    }
    
    return null;
}

// 🔴 BOLINHA — VISUAL IDÊNTICO
function desenharBolinha(x, y, fixada) {
    ctx.shadowColor = fixada ? '#fbbf24' : '#ff0000';
    ctx.shadowBlur = fixada ? 40 : 30;
    ctx.strokeStyle = fixada ? '#fbbf24' : '#ff0000';
    ctx.lineWidth = 7;
    
    ctx.beginPath();
    ctx.arc(x, y, 35, 0, Math.PI * 2);
    ctx.stroke();
    
    ctx.fillStyle = fixada ? 'rgba(251,191,36,0.25)' : 'rgba(255,0,0,0.3)';
    ctx.fill();
    
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.stroke();
    
    ctx.shadowBlur = 0;
}

btn.desligar.addEventListener('click', () => {
    if (estado.stream) {
        estado.stream.getTracks().forEach(t => t.stop());
    }
    
    estado.ligado = false;
    estado.pedrinhaFixada = false;
    estado.ultimaX = 0;
    estado.ultimaY = 0;
    estado.confianca = 0;
    estado.stream = null;
    
    video.srcObject = null;
    ctx.clearRect(0, 0, estado.largura, estado.altura);
    
    statusEl.textContent = "Câmera desligada";
    statusEl.className = "status aguardando";
    infoEl.innerHTML = `<div class="mensagem">Ligue e mostre a pedrinha para fixar</div>`;
    
    btn.ligar.disabled = false;
    btn.marcar.disabled = true;
    btn.marcar.textContent = "🎯 FIXAR PEDRINHA";
    btn.desligar.disabled = true;
});
</script>
</body>
</html>
