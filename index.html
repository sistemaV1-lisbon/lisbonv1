<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LISBON v1 - CÂMERA FUNCIONAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #000; overflow: hidden; font-family: sans-serif; color: white; }
        
        /* Tela Câmera */
        .camera-wrapper { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(1); }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        
        /* Barra de Status */
        .status { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: rgba(0,0,0,0.8); padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .ok { color: #22c55e; }
        .erro { color: #ef4444; }
        
        /* Resultado */
        .resultado { position: fixed; top: 70px; left: 0; right: 0; z-index: 10; text-align: center; padding: 15px; font-size: 1.3rem; font-weight: bold; background: rgba(0,0,0,0.6); }
        
        /* Botões */
        .controles { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; padding: 15px; background: linear-gradient(to top, #000, transparent); display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        button { padding: 16px; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.4; }
        .ligar { background: #16a34a; }
        .analisar { background: #f59e0b; color: #000; }
        .rastrear { background: #dc2626; }
        .parar { background: #475569; }
        .estat { background: #2563eb; }
        .desligar { background: #1f2937; border: 1px solid #ef4444; }
        
        /* Modal */
        .modal { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.9); padding: 20px; overflow-y: auto; }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .caixa { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

<div class="status">
    <span id="status">📴 Sistema Offline</span>
    <span id="cam-status" class="erro">Câmera: ❌</span>
</div>

<div class="resultado" id="resultado">
    Aperte LIGAR e PERMITA CÂMERA quando pedir
</div>

<div class="camera-wrapper">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<div class="controles">
    <button class="ligar" id="btnLigar">🔘 LIGAR CÂMERA</button>
    <button class="analisar" id="btnAnalisar" disabled>🔍 ANALISAR</button>
    <button class="rastrear" id="btnRastrear" disabled>🎯 RASTREAR</button>
    <button class="parar" id="btnParar" disabled>⏹️ PARAR</button>
    <button class="estat" id="btnEstat">📊 JOGADAS</button>
    <button class="desligar" id="btnDesligar" disabled>⭕ DESLIGAR</button>
</div>

<div class="modal" id="modal">
    <div class="caixa">
        <h2 class="text-xl font-bold mb-4 text-amber-400">📊 ESTATÍSTICAS</h2>
        <p class="flex justify-between py-2 border-b border-slate-700">Total: <span id="estTotal">0</span></p>
        <p class="flex justify-between py-2 border-b border-slate-700">Copo 1: <span id="estC1">0%</span></p>
        <p class="flex justify-between py-2 border-b border-slate-700">Copo 2: <span id="estC2">0%</span></p>
        <p class="flex justify-between py-2 border-b border-slate-700">Copo 3: <span id="estC3">0%</span></p>
        <p class="flex justify-between py-2 font-bold text-green-400">Melhor: <span id="estMelhor">—</span></p>
        <button class="desligar w-full mt-4" id="btnFechar">FECHAR</button>
    </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const resultado = document.getElementById('resultado');
const status = document.getElementById('status');
const camStatus = document.getElementById('cam-status');

const btn = {
    ligar: document.getElementById('btnLigar'),
    analisar: document.getElementById('btnAnalisar'),
    rastrear: document.getElementById('btnRastrear'),
    parar: document.getElementById('btnParar'),
    estat: document.getElementById('btnEstat'),
    desligar: document.getElementById('btnDesligar')
};

const estado = { ligado: false, rastreando: false, rodadas: [], stream: null };

// 🔴 PERFIL DA PEDRINHA VERMELHA
const COR = { hMin: 0, hMax: 15, sMin: 120, sMax: 255, lMin: 40, lMax: 160 };

// ✅ FUNÇÃO PRINCIPAL: ABRIR CÂMERA TRASEIRA
btn.ligar.addEventListener('click', async () => {
    try {
        // CONFIGURAÇÃO OTIMIZADA PARA CELULAR
        const config = {
            video: {
                facingMode: { exact: "environment" }, // CÂMERA TRASEIRA
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }
        };

        estado.stream = await navigator.mediaDevices.getUserMedia(config);
        video.srcObject = estado.stream;

        await video.play(); // Garante reprodução

        // Ajusta tamanho do canvas
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // SUCESSO
        estado.ligado = true;
        status.textContent = "✅ SISTEMA LIGADO";
        camStatus.textContent = "Câmera: ✅";
        camStatus.className = "ok";
        resultado.textContent = "Câmera OK! Aperte ANALISAR para treinar IA";

        btn.ligar.disabled = true;
        btn.analisar.disabled = false;
        btn.desligar.disabled = false;

    } catch (erro) {
        // SE DER ERRO (PERMISSÃO OU TRASEIRA), TENTA QUALQUER CÂMERA
        try {
            estado.stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = estado.stream;
            await video.play();
            
            estado.ligado = true;
            status.textContent = "⚠️ CÂMERA ALTERNATIVA";
            camStatus.textContent = "Câmera: ✅";
            camStatus.className = "ok";
            resultado.textContent = "Funcionando! Aperte ANALISAR";

            btn.ligar.disabled = true;
            btn.analisar.disabled = false;
            btn.desligar.disabled = false;

        } catch (erroFinal) {
            status.textContent = "❌ ERRO DE CÂMERA";
            camStatus.textContent = "Câmera: ❌";
            resultado.innerHTML = `
                <strong>Não abriu!</strong><br>
                1. Clique em ⚙️/Config do navegador<br>
                2. Permita CÂMERA para este site<br>
                3. Atualize a página
            `;
        }
    }
});

// 🧠 ANÁLISE
btn.analisar.addEventListener('click', () => {
    if (!estado.ligado) return;
    resultado.textContent = "🧠 IA APRENDENDO... AGUARDE 3s";
    btn.analisar.disabled = true;

    setTimeout(() => {
        resultado.textContent = "✅ PRONTO! APERTE RASTREAR";
        btn.rastrear.disabled = false;
    }, 3000);
});

// 🎯 RASTREIO
btn.rastrear.addEventListener('click', () => {
    estado.rastreando = true;
    resultado.textContent = "🔍 RASTREANDO... APONTE PARA OS COPOS";
    btn.rastrear.disabled = true;
    btn.parar.disabled = false;
    loop();
});

function loop() {
    if (!estado.rastreando) return;

    const copo = detectar();
    if (copo > 0) {
        resultado.innerHTML = `🎯 <strong>NO COPO ${copo}</strong> | 100%`;
        estado.rodadas.push(copo);
    } else {
        resultado.textContent = "❓ PEDRINHA NÃO VISTA — AJUSTE ÂNGULO/LUZ";
    }

    requestAnimationFrame(loop);
}

// 🧠 DETECÇÃO VISUAL
function detectar() {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dados = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let pontos = 0;
    let centroX = 0;

    for (let i = 0; i < dados.length; i += 16) {
        const r = dados[i], g = dados[i+1], b = dados[i+2];
        const hsl = rgbHsl(r,g,b);

        if (hsl.h >= COR.hMin && hsl.h <= COR.hMax &&
            hsl.s >= COR.sMin && hsl.s <= COR.sMax &&
            hsl.l >= COR.lMin && hsl.l <= COR.lMax) {
            pontos++;
            centroX += (i/4 % canvas.width);
        }
    }

    if (pontos > 6) {
        centroX /= pontos;
        const terco = canvas.width / 3;
        return centroX < terco ? 1 : centroX < terco*2 ? 2 : 3;
    }
    return 0;
}

function rgbHsl(r,g,b) {
    r /=255; g/=255; b/=255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    let h, s, l = (max+min)/2;
    if (max === min) h = s = 0;
    else {
        const d = max - min;
        s = l > 0.5 ? d/(2-max-min) : d/(max+min);
        switch(max){
            case r: h = ((g-b)/d + (g<b?6:0))/6; break;
            case g: h = ((b-r)/d +2)/6; break;
            case b: h = ((r-g)/d +4)/6; break;
        }
    }
    return {h:h*360, s:s*255, l:l*255};
}

// ⏹️ PARAR
btn.parar.addEventListener('click', () => {
    estado.rastreando = false;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    resultado.textContent = "⏸️ PAUSADO";
    btn.parar.disabled = true;
    btn.rastrear.disabled = false;
});

// 📊 ESTATÍSTICAS
btn.estat.addEventListener('click', () => {
    const r = estado.rodadas, t = r.length || 1;
    const c1 = r.filter(x=>x===1).length;
    const c2 = r.filter(x=>x===2).length;
    const c3 = r.filter(x=>x===3).length;

    document.getElementById('estTotal').textContent = r.length;
    document.getElementById('estC1').textContent = ((c1/t)*100).toFixed(0)+"%";
    document.getElementById('estC2').textContent = ((c2/t)*100).toFixed(0)+"%";
    document.getElementById('estC3').textContent = ((c3/t)*100).toFixed(0)+"%";
    document.getElementById('estMelhor').textContent = !r.length?"—":c1>=c2&&c1>=c3?"Copo1":c2>=c3?"Copo2":"Copo3";
    document.getElementById('modal').classList.add('active');
});

document.getElementById('btnFechar').addEventListener('click', () => {
    document.getElementById('modal').classList.remove('active');
});

// ⭕ DESLIGAR
btn.desligar.addEventListener('click', () => {
    if (estado.stream) estado.stream.getTracks().forEach(t=>t.stop());
    estado.ligado = estado.rastreando = false;
    estado.rodadas = [];
    video.srcObject = null;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    status.textContent = "📴 DESLIGADO";
    camStatus.textContent = "Câmera: ❌";
    camStatus.className = "erro";
    resultado.textContent = "Clique LIGAR novamente";

    btn.ligar.disabled = false;
    btn.analisar.disabled = btn.rastrear.disabled = btn.parar.disabled = btn.desligar.disabled = true;
});
</script>
</body>
