<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LISBON — LEVE & RÁPIDA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #000; overflow: hidden; font-family: sans-serif; color: white; }
        
        .camera-container { position: fixed; inset: 0; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(1); }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .divisores { position: fixed; inset: 0; display: flex; pointer-events: none; opacity: 0.3; }
        .area { flex: 1; border-right: 2px dashed #fbbf24; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: bold; color: #fbbf24; }
        .area:last-child { border-right: none; }
        
        .topo { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: rgba(0,0,0,0.8); padding: 10px; text-align: center; border-bottom: 2px solid #ef4444; }
        .titulo { font-weight: bold; font-size: 1rem; color: #ef4444; }
        .status { font-size: 0.9rem; margin-top: 4px; }
        .on { color: #22c55e; }
        .aguardando { color: #f59e0b; }
        
        .info { position: fixed; top: 70px; left: 0; right: 0; z-index: 20; text-align: center; padding: 10px; background: rgba(0,0,0,0.6); font-size: 1.1rem; font-weight: bold; }
        .fixada { color: #fbbf24; text-shadow: 0 0 15px rgba(251,191,36,0.6); font-size: 1.5rem; }
        .encontrada { color: #22c55e; }
        
        .botoes { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; padding: 15px; background: linear-gradient(to top, #000 70%, transparent); display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        button { padding: 15px 8px; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        button:active { transform: scale(0.95); }
        .ligar { background: #16a34a; }
        .fixar { background: #f59e0b; color: #000; }
        .desligar { background: #1f2937; border: 2px solid #ef4444; }
    </style>
</head>
<body>

<div class="divisores">
    <div class="area">1</div>
    <div class="area">2</div>
    <div class="area">3</div>
</div>

<div class="topo">
    <div class="titulo">🎯 LISBON — RASTREIO PURO</div>
    <div id="status" class="status aguardando">Câmera desligada</div>
</div>

<div id="info" class="info">
    <div>Ligue e mostre a pedrinha vermelha</div>
</div>

<div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<div class="botoes">
    <button id="btnLigar" class="ligar">🔘 LIGAR</button>
    <button id="btnFixar" class="fixar" disabled>🎯 FIXAR</button>
    <button id="btnDesligar" class="desligar" disabled>⭕ DESLIGAR</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: false });
const infoEl = document.getElementById('info');
const statusEl = document.getElementById('status');

const btn = {
    ligar: document.getElementById('btnLigar'),
    fixar: document.getElementById('btnFixar'),
    desligar: document.getElementById('btnDesligar')
};

const estado = {
    ligado: false,
    stream: null,
    fixada: false,
    x: 0,
    y: 0,
    conf: 0,
    ultimoTempo: 0,
    largura: 0,
    altura: 0
};

// 🔴 PERFIL EXATO DA PEDRINHA — LEVE E PRECISO
const PEDRINHA = {
    rMin: 150, rMax: 255,
    gMin: 0, gMax: 100,
    bMin: 0, bMax: 100,
    minPts: 2,
    maxPts: 150,
    pesoVermelho: 2.5,
    suavidade: 0.65,
    memoriaMs: 3000,
    passo: 4 // ⚡ Lê de 4 em 4 pixels — MUITO mais leve
};

btn.ligar.addEventListener('click', async () => {
    try {
        estado.stream = await navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: 'environment',
                width: { ideal: 640 }, // ⚡ Resolução leve
                height: { ideal: 480 },
                frameRate: { ideal: 24 }
            }
        });
        video.srcObject = estado.stream;
        await video.play();
        
        estado.largura = canvas.width = video.videoWidth;
        estado.altura = canvas.height = video.videoHeight;
        
        estado.ligado = true;
        statusEl.textContent = "✅ CÂMERA LIGADA";
        statusEl.className = "status on";
        infoEl.innerHTML = `<div>Mostre a pedrinha → clique FIXAR</div>`;
        
        btn.ligar.disabled = true;
        btn.fixar.disabled = false;
        btn.desligar.disabled = false;
        
        loop();
        
    } catch {
        infoEl.innerHTML = `<div style="color:#ef4444">❌ Permita a câmera</div>`;
    }
});

btn.fixar.addEventListener('click', () => {
    const achou = procurar();
    if (achou) {
        estado.fixada = true;
        estado.x = achou.x;
        estado.y = achou.y;
        estado.conf = achou.conf;
        estado.ultimoTempo = Date.now();
        
        infoEl.innerHTML = `<div class="fixada">✅ PEDRINHA FIXADA — NÃO SOLTA MAIS!</div>`;
        btn.fixar.disabled = true;
        btn.fixar.textContent = "✅ FIXADA";
    } else {
        infoEl.innerHTML = `<div style="color:#f59e0b">⚠️ Mostre a pedrinha primeiro</div>`;
    }
});

function loop() {
    if (!estado.ligado) return;
    
    const agora = Date.now();
    
    ctx.clearRect(0, 0, estado.largura, estado.altura);
    ctx.drawImage(video, 0, 0, estado.largura, estado.altura);
    
    const vista = procurar();
    
    if (vista) {
        if (estado.fixada) {
            // Segue suave e fiel
            estado.x = estado.x * PEDRINHA.suavidade + vista.x * (1 - PEDRINHA.suavidade);
            estado.y = estado.y * PEDRINHA.suavidade + vista.y * (1 - PEDRINHA.suavidade);
        } else {
            estado.x = vista.x;
            estado.y = vista.y;
        }
        estado.conf = vista.conf;
        estado.ultimoTempo = agora;
        
        if (estado.fixada) {
            statusEl.textContent = `✅ Vendo — Confiança: ${estado.conf}%`;
        } else {
            statusEl.textContent = "🔍 Procurando...";
        }
        statusEl.className = "status on";
        
    } else if (estado.fixada && estado.x) {
        const semVer = agora - estado.ultimoTempo;
        if (semVer < PEDRINHA.memoriaMs) {
            statusEl.textContent = "👀 Coberta — mantendo rastro...";
        } else {
            statusEl.textContent = "⚠️ Aguardando reaparecer";
        }
        statusEl.className = "status aguardando";
    }
    
    // Mostra qual copo
    if (estado.x && estado.conf > 40) {
        let copo = 0;
        if (estado.x < estado.largura / 3) copo = 1;
        else if (estado.x < estado.largura * 2 / 3) copo = 2;
        else copo = 3;
        
        if (estado.fixada) {
            infoEl.innerHTML = `<div class="fixada">🎯 COPO ${copo} — PEDRINHA AQUI!</div>`;
        } else {
            infoEl.innerHTML = `<div class="encontrada">🎯 COPO ${copo}</div>`;
        }
    }
    
    // Desenha a bolinha
    if (estado.x && estado.y) {
        desenhar(estado.x, estado.y, estado.fixada, agora - estado.ultimoTempo > 1000);
    }
    
    requestAnimationFrame(loop);
}

// 🔍 DETECÇÃO LEVE — SEM CALCULOS DESNECESSÁRIOS
function procurar() {
    const img = ctx.getImageData(0, 0, estado.largura, estado.altura);
    const d = img.data;
    
    let total = 0, somaX = 0, somaY = 0;
    
    for (let i = 0; i < d.length; i += 4 * PEDRINHA.passo) {
        const r = d[i], g = d[i+1], b = d[i+2];
        
        if (r < PEDRINHA.rMin || r > PEDRINHA.rMax) continue;
        if (g > PEDRINHA.gMax) continue;
        if (b > PEDRINHA.bMax) continue;
        if (r <= g * PEDRINHA.pesoVermelho || r <= b * PEDRINHA.pesoVermelho) continue;
        
        total++;
        const idx = i / 4;
        somaX += idx % estado.largura;
        somaY += (idx / estado.largura) | 0;
    }
    
    if (total >= PEDRINHA.minPts && total <= PEDRINHA.maxPts) {
        return {
            x: somaX / total,
            y: somaY / total,
            conf: Math.min(100, total * 3)
        };
    }
    return null;
}

// 🔴 BOLINHA — MESMO VISUAL
function desenhar(x, y, fixada, tracejado) {
    ctx.shadowColor = fixada ? '#fbbf24' : '#ff0000';
    ctx.shadowBlur = fixada ? 40 : 25;
    ctx.strokeStyle = fixada ? '#fbbf24' : '#ff0000';
    ctx.lineWidth = 7;
    
    if (tracejado) ctx.setLineDash([6, 4]);
    else ctx.setLineDash([]);
    
    ctx.beginPath();
    ctx.arc(x, y, 32, 0, Math.PI * 2);
    ctx.stroke();
    
    ctx.fillStyle = fixada ? 'rgba(251,191,36,0.25)' : 'rgba(255,0,0,0.25)';
    ctx.fill();
    
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.stroke();
    
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;
}

btn.desligar.addEventListener('click', () => {
    if (estado.stream) estado.stream.getTracks().forEach(t => t.stop());
    
    estado.ligado = false;
    estado.fixada = false;
    estado.x = estado.y = 0;
    estado.conf = 0;
    estado.stream = null;
    
    video.srcObject = null;
    ctx.clearRect(0, 0, estado.largura, estado.altura);
    
    statusEl.textContent = "Câmera desligada";
    statusEl.className = "status aguardando";
    infoEl.innerHTML = `<div>Ligue e mostre a pedrinha</div>`;
    
    btn.ligar.disabled = false;
    btn.fixar.disabled = true;
    btn.fixar.textContent = "🎯 FIXAR";
    btn.desligar.disabled = true;
});
</script>
</body>
</html>
